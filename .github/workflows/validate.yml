name: validate

on:
  push:
  pull_request:

jobs:
  higs:
    name: HIGS (schema + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Instalar jsonschema
        run: python -m pip install --upgrade pip jsonschema
      - name: Validar specs HIGS
        run: bash scripts/validate-higs.sh

  encoding:
    name: Codificación (UTF-8 sin BOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validar codificación
        run: bash scripts/validate-encoding.sh

  orchestrator:
    name: Orquestador (adaptador libretro + core de prueba)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar y ejecutar el test del adaptador
        run: make -C tools/orchestrator test
      - name: Sintaxis de scripts de shell
        run: for f in scripts/*.sh; do bash -n "$f" || exit 1; done

  # El transpiler necesita `eng/core` (repo privado Amiga-Cpp) y ROMs propias, que
  # el CI público NO tiene; por eso aquí solo se validan invariantes estáticos y
  # la sintaxis de los tests. La batería completa (`make -C tools/transpiler
  # test-all`: run.sh + banks_test.sh + static_size_test.sh) se ejecuta en un
  # runner con engine + ROMs (self-hosted), no en el CI público.
  transpiler-static:
    name: Transpiler (invariantes estáticos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sin tabla de despacho densa (256 KB de RAM en 68000)
        run: |
          if grep -rnE 'static +BlockFn +dispatch_table\[0x10000\]' \
               conversion/nes-to-amiga500/tools/transpiler/src; then
            echo "FALLA: se ha reintroducido dispatch_table[0x10000]" >&2
            exit 1
          fi
      - name: Sintaxis de los tests del transpiler
        run: |
          for f in conversion/nes-to-amiga500/tools/transpiler/tests/*.sh; do
            bash -n "$f" || exit 1
          done
