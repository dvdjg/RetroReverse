name: validate

on:
  push:
  pull_request:

jobs:
  higs:
    name: HIGS (schema + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Instalar jsonschema
        run: python -m pip install --upgrade pip jsonschema
      - name: Validar specs HIGS
        run: bash scripts/validate-higs.sh

  encoding:
    name: Codificación (UTF-8 sin BOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validar codificación
        run: bash scripts/validate-encoding.sh
